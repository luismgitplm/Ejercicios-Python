<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    {% extends 'index.html' %}
    <title>Document</title>
</head>
<body>
    {%block content%}
    <h1>Listado de autores</h1>
    <ul>
        {% for aut in authors %}
        <li>
            {{ aut }} 
            <a href="/editarAutor/{{aut.id}}">Editar</a>
            <a href="/eliminarAutor/{{aut.id}}"
                onclick="return confirm('¿Estás seguro?');">
                Eliminar</a>
        </li>
         <!-- Lo que contiene la variable autor
        es una lista -->
        {% endfor %}
    </ul>
    <div><a href="/crearAutor/">Registrar nuevo autor</a></div>
    {%endblock%}
</body>
</html>
